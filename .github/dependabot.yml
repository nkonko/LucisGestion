version: 2
updates:
  # Monitor JavaScript dependencies (pnpm projects still use package-ecosystem: npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "nkonko"
    assignees:
      - "nkonko"
    labels:
      - "dependencies"
      - "pnpm"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    groups:
      angular-stack:
        patterns:
          - "@angular/*"
          - "@ngrx/*"
          - "angular-eslint"
          - "@angular-eslint/*"
          - "@angular/fire"
    ignore:
      # Avoid isolated Angular major bumps; do framework major upgrades in a coordinated PR.
      - dependency-name: "@angular/*"
        update-types:
          - "version-update:semver-major"
    allow:
      - dependency-type: "all"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    reviewers:
      - "nkonko"
    assignees:
      - "nkonko"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps):"
