name: Firebase Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: pnpm test:ci

      - name: Generate production environment file
        env:
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const clean = (v) => (v ?? '').replace(/\r/g, '').trim();

          const emails = clean(process.env.ALLOWED_EMAILS)
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);

          if (emails.length === 0) {
            console.error('ALLOWED_EMAILS is empty. Configure it in the Production environment variables.');
            process.exit(1);
          }

          const firebase = {
            apiKey: clean(process.env.FIREBASE_API_KEY),
            authDomain: clean(process.env.FIREBASE_AUTH_DOMAIN),
            projectId: clean(process.env.FIREBASE_PROJECT_ID),
            storageBucket: clean(process.env.FIREBASE_STORAGE_BUCKET),
            messagingSenderId: clean(process.env.FIREBASE_MESSAGING_SENDER_ID),
            appId: clean(process.env.FIREBASE_APP_ID),
          };

          for (const [key, value] of Object.entries(firebase)) {
            if (!value) {
              console.error(`Missing Firebase variable: ${key}`);
              process.exit(1);
            }
          }

          const gemini = {
            apiKey: clean(process.env.GEMINI_API_KEY),
            model: clean(process.env.GEMINI_MODEL) || 'gemini-2.5-flash',
            baseUrl: clean(process.env.GEMINI_BASE_URL) || 'https://generativelanguage.googleapis.com/v1beta/models',
          };

          const sentry = {
            dsn: clean(process.env.SENTRY_DSN),
          };

          const contents = `export const environment = ${JSON.stringify(
            { production: true, sentry, allowedEmails: emails, firebase, gemini },
            null,
            2,
          )};\n`;

          fs.writeFileSync('src/environments/environment.ts', contents);
          console.log('environment.ts generated with', emails.length, 'allowed email(s).');
          NODE

      - name: Build app
        run: pnpm build

      - name: Upload sourcemaps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: node scripts/upload-sourcemaps.mjs "${{ github.ref_name }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        run: pnpm exec firebase deploy --only firestore:rules,firestore:indexes --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
