name: Firebase Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm run test:ci

      - name: Generate production environment file
        run: |
          ALLOWED_EMAILS_TS=$(echo "${{ vars.ALLOWED_EMAILS }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | sed '/^$/d' | sed "s/.*/'&'/" | paste -sd, -)

          if [ -z "$ALLOWED_EMAILS_TS" ]; then
            echo "ALLOWED_EMAILS is empty. Configure it in the Production environment variables."
            exit 1
          fi

          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            allowedEmails: [$ALLOWED_EMAILS_TS],
            firebase: {
              apiKey: '${{ vars.FIREBASE_API_KEY }}',
              authDomain: '${{ vars.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ vars.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ vars.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ vars.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ vars.FIREBASE_APP_ID }}',
            },
          };
          EOF

      - name: Build app
        run: npm run build

      - name: Deploy to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
