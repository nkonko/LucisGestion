name: Firebase Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:ci

      - name: Generate production environment file
        env:
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const clean = (v) => (v ?? '').replace(/\r/g, '').trim();

          const emails = clean(process.env.ALLOWED_EMAILS)
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);

          if (emails.length === 0) {
            console.error('ALLOWED_EMAILS is empty. Configure it in the Production environment variables.');
            process.exit(1);
          }

          const firebase = {
            apiKey: clean(process.env.FIREBASE_API_KEY),
            authDomain: clean(process.env.FIREBASE_AUTH_DOMAIN),
            projectId: clean(process.env.FIREBASE_PROJECT_ID),
            storageBucket: clean(process.env.FIREBASE_STORAGE_BUCKET),
            messagingSenderId: clean(process.env.FIREBASE_MESSAGING_SENDER_ID),
            appId: clean(process.env.FIREBASE_APP_ID),
          };

          for (const [key, value] of Object.entries(firebase)) {
            if (!value) {
              console.error(`Missing Firebase variable: ${key}`);
              process.exit(1);
            }
          }

          const contents = `export const environment = ${JSON.stringify(
            { production: true, allowedEmails: emails, firebase },
            null,
            2,
          )};\n`;

          fs.writeFileSync('src/environments/environment.ts', contents);
          console.log('environment.ts generated with', emails.length, 'allowed email(s).');
          NODE

      - name: Build app
        run: pnpm build

      - name: Deploy to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
