name: Firebase Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  checks: write
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: Preview
    if: "!contains(github.event.pull_request.labels.*.name, 'no-preview')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: pnpm test:ci

      - name: Generate preview environment file
        run: |
          ALLOWED_EMAILS_TS=$(echo "${{ vars.ALLOWED_EMAILS }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | sed '/^$/d' | sed "s/.*/'&'/" | paste -sd, -)

          if [ -z "$ALLOWED_EMAILS_TS" ]; then
            echo "ALLOWED_EMAILS is empty. Configure it in the preview environment variables."
            exit 1
          fi

          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: false,
            sentry: {
              dsn: '${{ vars.SENTRY_DSN }}',
            },
            allowedEmails: [$ALLOWED_EMAILS_TS],
            gemini: {
              apiKey: '${{ vars.GEMINI_API_KEY }}',
              model: '${{ vars.GEMINI_MODEL }}',
              baseUrl: '${{ vars.GEMINI_BASE_URL }}',
            },
            firebase: {
              apiKey: '${{ vars.FIREBASE_API_KEY }}',
              authDomain: '${{ vars.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ vars.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ vars.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ vars.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ vars.FIREBASE_APP_ID }}',
            },
          };
          EOF

      - name: Build app
        run: pnpm build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes (preview project)
        run: pnpm exec firebase deploy --only firestore:rules,firestore:indexes --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy to Firebase Hosting preview channel
        run: pnpm exec firebase hosting:channel:deploy pr${{ github.event.pull_request.number }} --expires 7d --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
