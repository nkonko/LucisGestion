name: Firebase Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  checks: write
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: Preview
    if: "!contains(github.event.pull_request.labels.*.name, 'no-preview')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:ci

      - name: Generate preview environment file
        run: |
          ALLOWED_EMAILS_TS=$(echo "${{ vars.ALLOWED_EMAILS }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | sed '/^$/d' | sed "s/.*/'&'/" | paste -sd, -)

          if [ -z "$ALLOWED_EMAILS_TS" ]; then
            echo "ALLOWED_EMAILS is empty. Configure it in the preview environment variables."
            exit 1
          fi

          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: false,
            allowedEmails: [$ALLOWED_EMAILS_TS],
            firebase: {
              apiKey: '${{ vars.FIREBASE_API_KEY }}',
              authDomain: '${{ vars.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ vars.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ vars.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ vars.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ vars.FIREBASE_APP_ID }}',
            },
          };
          EOF

      - name: Build app
        run: pnpm build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: pnpm install --global firebase-tools

      - name: Deploy to Firebase Hosting preview channel
        run: firebase hosting:channel:deploy pr${{ github.event.pull_request.number }} --expires 7d --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
