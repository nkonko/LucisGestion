<h2 class="section-heading mb-4">Ingredientes</h2>
<p class="ingredients-subtitle">Tocá un ingrediente para ver su historial de precios.</p>

<div class="w-full mb-4">
  <label class="ui-field">
    <span>Buscar ingrediente</span>
    <input class="ui-input" (input)="onSearchInput($event)" [value]="searchTerm()" />
  </label>
</div>

@if (filteredIngredients().length === 0) {
  <div class="text-center py-8 text-gray-400">
    <ui-icon name="egg" [size]="48" [decorative]="true" />
    @if (searchTerm()) {
      <p>No se encontraron ingredientes</p>
    } @else {
      <p>No hay ingredientes cargados aún</p>
    }
  </div>
}

<div class="ingredients-grid">
  @for (ingredient of filteredIngredients(); track ingredient.id) {
    <button
      type="button"
      class="ingredient-tile ui-card-surface touch-card"
      (click)="openHistory(ingredient)"
      [attr.aria-label]="'Ver historial de precios de ' + ingredient.name"
    >
      <span class="ingredient-tile__icon" aria-hidden="true">{{ getIngredientIcon(ingredient) }}</span>
      <span class="ingredient-tile__name">{{ ingredient.name }}</span>
      <span class="ingredient-tile__price">{{ ingredient.unitPrice | ars }} / {{ ingredient.unit }}</span>
      <span class="ingredient-tile__hint">
        <ui-icon name="history" [size]="16" [decorative]="true" />
        Ver historial
      </span>
    </button>
  }
</div>
