<h2 class="text-xl font-semibold mb-1">{{ isEdit ? 'Editar costo fijo' : 'Nuevo costo fijo' }}</h2>
<p class="text-sm text-gray-500 mb-4">Aplica a {{ monthLabel }}</p>

<div class="flex flex-col gap-3">
  <label class="ui-field">
    <span>Nombre</span>
    <input
      data-initial-focus
      class="ui-input"
      type="text"
      [(ngModel)]="form.name"
      required
      autocomplete="off"
    />
  </label>

  <label class="ui-field">
    <span>Descripción (opcional)</span>
    <input class="ui-input" type="text" [(ngModel)]="form.description" autocomplete="off" />
  </label>

  <label class="ui-field">
    <span>Categoría</span>
    <select class="ui-select" [(ngModel)]="form.category" required>
      @for (c of categories; track c.key) {
        <option [value]="c.key">{{ c.label }}</option>
      }
    </select>
  </label>

  <label class="ui-field">
    <span>Monto (mensual)</span>
    <input
      class="ui-input"
      type="number"
      inputmode="decimal"
      min="0"
      step="1"
      [(ngModel)]="form.amount"
      required
    />
  </label>
</div>

<div class="flex justify-end gap-2 mt-5">
  <button class="ui-btn" type="button" (click)="cancel()">Cancelar</button>
  <button
    class="ui-btn ui-btn-primary"
    type="button"
    (click)="save()"
    [disabled]="!isValid()"
  >
    {{ isEdit ? 'Guardar cambios' : 'Crear' }}
  </button>
</div>
