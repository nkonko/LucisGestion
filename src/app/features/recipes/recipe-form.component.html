<h2 class="text-xl font-semibold mb-3">{{ isEdit ? 'Editar' : 'Nueva' }} Receta</h2>
<div class="flex flex-col gap-3 pt-1">
  <label class="ui-field"
    ><span>Nombre</span><input data-initial-focus class="ui-input" [(ngModel)]="form.name" required
  /></label>
  <app-category-form
    [category]="form.category"
    [yieldValue]="form.yield"
    (categoryChange)="form.category = $event"
    (yieldValueChange)="form.yield = $event"
  ></app-category-form>

  <hr class="border-gray-200" />

  <app-ingredient-form
    [recipeIngredients]="recipeIngredients()"
    (recipeIngredientsChange)="recipeIngredients.set($event)"
  ></app-ingredient-form>

  <hr class="border-gray-200" />

  <app-cost-form
    [calculatedCost]="calculatedCost()"
    [suggestedPrice]="suggestedPrice()"
    [profitMargin]="profitMargin()"
    [salePrice]="form.salePrice"
    (profitMarginChange)="profitMargin.set($event)"
    (salePriceChange)="form.salePrice = $event"
  ></app-cost-form>

  <hr class="border-gray-200" />

  <label class="ui-field"
    ><span>Notas / Instrucciones</span
    ><textarea class="ui-textarea" [(ngModel)]="form.notes" rows="2"></textarea>
  </label>
</div>

<div class="flex justify-end gap-2 mt-4">
  @if (isEdit) {
    <button class="ui-btn ui-btn-danger" type="button" (click)="remove()">Eliminar</button>
  }
  <button class="ui-btn" type="button" (click)="cancel()">Cancelar</button
  ><button class="ui-btn ui-btn-primary" type="button" (click)="save()" [disabled]="!isValid()">
    {{ isEdit ? 'Guardar' : 'Crear' }}
  </button>
</div>
