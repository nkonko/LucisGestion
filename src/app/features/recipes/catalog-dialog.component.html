<div id="catalog-content" class="catalog">
  <div class="catalog-brand">
    <div class="text-3xl">🧁</div>
    <h3 class="text-lg font-bold">Lucis Pastelería</h3>
    <p class="text-xs text-gray-500">Catálogo de productos</p>
  </div>

  <div class="catalog-actions">
    <button class="ui-icon-btn" type="button" (click)="share()" aria-label="Compartir">
      <ui-icon name="share" [decorative]="true" />
    </button>
    <button class="ui-icon-btn" type="button" (click)="print()" aria-label="Imprimir">
      <ui-icon name="print" [decorative]="true" />
    </button>
  </div>

  <div class="catalog-list">
    @for (recipe of store.recipes(); track recipe.id) {
      <div class="catalog-row">
        <div class="catalog-meta">
          <div class="font-medium">{{ recipe.name }}</div>
          <div class="catalog-category">{{ recipe.category }}</div>
        </div>
        @if (auth.isOwner()) {
          <div class="catalog-price">{{ recipe.salePrice | ars }}</div>
        }
      </div>
    }
  </div>
</div>
