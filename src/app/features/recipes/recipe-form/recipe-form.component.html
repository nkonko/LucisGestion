<section class="recipe-sheet ui-card-surface">
  <div class="recipe-sheet__body">
    <label class="ui-field recipe-field recipe-field--full">
      <span>Nombre</span>
      <input data-initial-focus class="ui-input" [(ngModel)]="form.name" required />
    </label>

    <app-category-form
      [category]="form.category"
      [yieldValue]="form.yield"
      (categoryChange)="form.category = $event"
      (yieldValueChange)="form.yield = $event"
    ></app-category-form>

    <app-recipe-ingredient-form
      [recipeIngredients]="recipeIngredients()"
      (recipeIngredientsChange)="recipeIngredients.set($event)"
    ></app-recipe-ingredient-form>

    <app-cost-form
      [calculatedCost]="calculatedCost()"
      [suggestedPrice]="suggestedPrice()"
      [profitMargin]="profitMargin()"
      [salePrice]="form.salePrice"
      (profitMarginChange)="profitMargin.set($event)"
      (salePriceChange)="form.salePrice = $event"
    ></app-cost-form>

    <label class="ui-field recipe-field recipe-field--full">
      <span>Notas / Instrucciones</span>
      <textarea class="ui-textarea" [(ngModel)]="form.notes" rows="2"></textarea>
    </label>
  </div>

  <footer class="recipe-sheet__actions">
    @if (isEdit) {
      <button class="recipe-delete-btn" type="button" (click)="remove()" aria-label="Eliminar receta">
        <ui-icon name="delete" [decorative]="true" />
      </button>
    }
    <button class="recipe-save-btn" type="button" [disabled]="!isValid()" (click)="save()">
      {{ isEdit ? 'Guardar cambios' : 'Crear receta' }}
    </button>
  </footer>
</section>
