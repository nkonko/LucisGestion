<div class="flex flex-col gap-3">
  <h3 class="text-sm font-medium">Ingredientes</h3>
  @for (ri of recipeIngredients(); track ri.ingredientId; let i = $index) {
    <div class="flex items-center gap-2">
      <span class="flex-1 text-sm">{{ ri.name }}</span
      ><input
        class="ui-input max-w-[160px]"
        type="number"
        [ngModel]="ri.quantity"
        (ngModelChange)="updateQuantity(i, $event)"
        min="0"
        step="0.1"
      /><span class="text-xs text-gray-500">{{ ri.unit }}</span
      ><span class="text-xs font-medium w-16 text-right">{{ ri.lineCost | ars }}</span
      ><button class="ui-btn ui-btn-danger" type="button" (click)="removeIngredient(i)">
        Quitar
      </button>
    </div>
  }
  <div class="grid grid-cols-[1fr_auto] gap-2 pt-1 items-end">
    <label class="ui-field"
      ><span>Agregar ingrediente...</span
      ><input
        class="ui-input"
        [ngModel]="ingredientSearch()"
        (ngModelChange)="ingredientSearch.set($event)"
        list="ingredients-options"
    /></label>
    <button
      class="ui-btn ui-btn-primary"
      type="button"
      (click)="addSelectedIngredient()"
      [disabled]="!selectedIngredient()"
    >
      Agregar
    </button>
  </div>
  <datalist id="ingredients-options">
    @for (ing of filteredIngredients(); track ing.id) {
      <option [value]="ing.name">{{ ing.unitPrice | ars }}/{{ ing.unit }}</option>
    }
  </datalist>
</div>
