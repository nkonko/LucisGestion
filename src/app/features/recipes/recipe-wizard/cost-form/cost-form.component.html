<div class="grid grid-cols-2 gap-2 text-center">
  <div>
    <div class="text-xs text-gray-500">Costo total</div>
    <div class="text-lg font-bold text-red-600">{{ calculatedCost() | ars }}</div>
  </div>
  <div>
    <label class="ui-field"
      ><span>Margen %</span
      ><input
        class="ui-input"
        type="number"
        [ngModel]="profitMargin()"
        (ngModelChange)="onProfitMarginChange($event)"
        min="0"
        max="1000"
    /></label>
  </div>
</div>
<div class="grid grid-cols-2 gap-2 text-center pt-1">
  <div>
    <div class="text-xs text-gray-500">Precio sugerido</div>
    <div class="text-lg font-bold text-green-600">{{ suggestedPrice() | ars }}</div>
  </div>
  <div class="flex justify-center my-2">
    <label class="ui-field precio-venta-field"
      ><span>Precio de venta final</span
      ><input
        class="ui-input"
        type="number"
        [ngModel]="salePrice()"
        (ngModelChange)="onSalePriceChange($event)"
        min="0"
      /><small
        class="text-xs text-gray-500 text-center"
        >No completar para usar el sugerido</small
      ></label
    >
  </div>
</div>
