<section class="report-page">

  <!-- ==================== HEADER ==================== -->
  <header class="report-header">
    <div class="report-header__top">
      <h2 class="section-heading mb-4">Reportes financieros</h2>
    </div>

    @if (hasAnySales()) {
      <div class="report-header__controls">
        <app-date-range-picker
          [dateFrom]="dateFromInputValue()"
          [dateTo]="dateToInputValue()"
          (dateFromChange)="onDateFromChange($event)"
          (dateToChange)="onDateToChange($event)"
        />
      </div>
    }
  </header>

  @if (hasAnySales()) {

  <app-kpi-summary
    [monthlySales]="monthlySales()"
    [periodVariableExpenses]="periodVariableExpenses()"
    [periodFixedCosts]="periodFixedCosts()"
    [netProfit]="netProfit()"
    [hasSalesData]="hasSalesData()"
    [variableCostRate]="variableCostRate()"
    [fixedCostRate]="fixedCostRate()"
    [isProfitable]="isProfitable()"
    [profitRate]="profitRate()"
  ></app-kpi-summary>

  <!-- ==================== INSIGHTS ==================== -->
  @if (hasInsights()) {
    <app-financial-insights
      [productOpportunities]="productOpportunities()"
      [expenseAnomalies]="expenseAnomalies()"
      [priorityCustomers]="priorityCustomers()"
    ></app-financial-insights>
  }

  <!-- ==================== TOP CUSTOMERS ==================== -->
  @if (hasCustomerShare()) {
    <app-top-customers [customers]="topCustomerShare()"></app-top-customers>
  }

  <!-- ==================== TOP PRODUCTS ==================== -->
  @if (hasTopProducts()) {
    <app-top-products [products]="topProducts()"></app-top-products>
  }

  <!-- ==================== LOW STOCK ==================== -->
  @if (hasLowStock()) {
    <app-low-stock [items]="lowStockItems()"></app-low-stock>
  }

  <!-- ==================== QUICK ACTIONS ==================== -->
  <section class="report-section" aria-label="Acciones rápidas">
    <div class="actions-bar">
      <button type="button" class="ui-btn report-action-btn report-action-btn--pdf" (click)="exportAsPdf()">
        <ui-icon name="print" [size]="16" [decorative]="true" />
        Exportar PDF
      </button>
      <button type="button" class="ui-btn report-action-btn report-action-btn--excel" (click)="exportAsExcel()">
        <ui-icon name="receipt_long" [size]="16" [decorative]="true" />
        Exportar Excel
      </button>
      <button
        type="button"
        class="ui-btn ui-btn-primary"
        (click)="openRecommendations()"
        [disabled]="isLoadingRecommendations()"
        [attr.aria-busy]="isLoadingRecommendations()"
      >
        <ui-icon
          [name]="isLoadingRecommendations() ? 'hourglass_bottom' : 'lightbulb'"
          [size]="16"
          [decorative]="true"
        />
        {{ isLoadingRecommendations() ? 'Generando...' : 'Recomendaciones IA' }}
      </button>
    </div>
  </section>

  } @else {
    <div class="empty-state">
      <ui-icon name="bar_chart" [size]="48" class="empty-state__icon" />
      <p class="empty-state__text">Cargue algunas ventas y comenzaremos a generar reportes para usted.</p>
    </div>
  }

</section>
