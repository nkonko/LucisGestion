<article class="sale-card ui-card-surface">
  <div class="sale-card-header">
    <div class="sale-card-main">
      <div class="sale-customer-name">{{ sale().customerName || 'Sin cliente' }}</div>
      <div class="sale-date">{{ sale().date.toDate() | date: 'dd/MM HH:mm' }}</div>
    </div>
    <div class="sale-card-summary">
      <div class="sale-total">{{ sale().total | ars }}</div>
      <span class="sale-status" [class]="statusClass">
        {{ statusLabel }}
      </span>
    </div>
  </div>

  <div class="sale-card-items">
    <div class="sale-items-list">
      @for (item of sale().items; track item.recipeId) {
        <div class="sale-item">
          <span class="sale-item-qty">{{ item.quantity }}×</span>
          <span class="sale-item-name">{{ item.name }}</span>
        </div>
      }
    </div>
  </div>

  @if (sale().status === 'pending') {
    <div class="sale-card-actions">
      @if (sale().customerName) {
        <button
          class="ui-icon-btn"
          (click)="requestWhatsApp()"
          aria-label="Enviar por WhatsApp"
          title="Enviar por WhatsApp"
          type="button"
        >
          <ui-icon name="chat" [decorative]="true" />
        </button>
      }
      <button class="ui-btn ui-btn-sm ui-btn-danger" (click)="requestStatusChange('cancelled')" type="button">Cancelar</button>
      <button class="ui-btn ui-btn-sm ui-btn-primary" (click)="requestStatusChange('delivered')" type="button">Entregar</button>
    </div>
  }
</article>
