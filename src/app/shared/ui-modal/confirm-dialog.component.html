<h2 class="text-lg font-semibold mb-1">{{ data.title }}</h2>
<p class="text-sm text-gray-600 mb-4">{{ data.message }}</p>
<div class="flex justify-end gap-2">
  <button class="ui-btn" type="button" (click)="cancel()" data-initial-focus>
    {{ data.cancelLabel ?? 'Cancelar' }}
  </button>
  <button
    type="button"
    [class]="data.destructive ? 'ui-btn ui-btn-danger' : 'ui-btn ui-btn-primary'"
    (click)="confirm()"
  >
    {{ data.confirmLabel ?? 'Confirmar' }}
  </button>
</div>
