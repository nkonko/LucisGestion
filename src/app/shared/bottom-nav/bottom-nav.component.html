<nav class="bottom-nav">
  <!-- Primary navigation items (always visible) -->
  <a routerLink="/dashboard" routerLinkActive="active" class="nav-item ui-nav-item">
    <ui-icon name="home" [decorative]="true" [size]="20" />
    <span class="nav-item__label">Inicio</span>
  </a>
  <a routerLink="/recetas" routerLinkActive="active" class="nav-item ui-nav-item">
    <ui-icon name="menu_book" [decorative]="true" [size]="20" />
    <span class="nav-item__label">Recetas</span>
  </a>
  <a routerLink="/ventas" routerLinkActive="active" class="nav-item ui-nav-item">
    <ui-icon name="point_of_sale" [decorative]="true" [size]="20" />
    <span class="nav-item__label">Ventas</span>
  </a>
  <a routerLink="/stock" routerLinkActive="active" class="nav-item ui-nav-item nav-item--badge">
    <ui-icon name="inventory_2" [decorative]="true" [size]="20" />
    @if (lowStockCount() > 0) {
      <span class="badge" aria-label="{{ lowStockCount() }} ingredientes con stock bajo">{{
        lowStockCount()
      }}</span>
    }
    <span class="nav-item__label">Stock</span>
  </a>

  <!-- Secondary navigation items (hidden on mobile, in dropdown) -->
  <a
    routerLink="/costos"
    routerLinkActive="active"
    class="nav-item ui-nav-item nav-item--secondary"
  >
    <ui-icon name="receipt_long" [decorative]="true" [size]="20" />
    <span class="nav-item__label">Costos</span>
  </a>
  <a
    routerLink="/clientes"
    routerLinkActive="active"
    class="nav-item ui-nav-item nav-item--secondary"
  >
    <ui-icon name="people" [decorative]="true" [size]="20" />
    <span class="nav-item__label">Clientes</span>
  </a>

  <!-- More menu button (visible on mobile) -->
  <div class="nav-more-menu" (click)="onMoreMenuClick($event)">
    <button
      class="nav-item ui-nav-item nav-item--more"
      type="button"
      aria-haspopup="menu"
      [attr.aria-expanded]="moreMenuOpen()"
      aria-label="Abrir menú adicional"
      (click)="toggleMoreMenu($event)"
    >
      <ui-icon name="more_vert" [decorative]="true" [size]="20" />
      <span class="nav-item__label">Más</span>
    </button>
    @if (moreMenuOpen()) {
      <div class="ui-menu ui-menu--nav" role="menu">
        <a
          routerLink="/costos"
          routerLinkActive="active"
          class="ui-menu-item ui-menu-link"
          role="menuitem"
          (click)="closeMenu()"
        >
          <ui-icon name="receipt_long" [decorative]="true" [size]="18" />
          <span>Costos</span>
        </a>
        <a
          routerLink="/clientes"
          routerLinkActive="active"
          class="ui-menu-item ui-menu-link"
          role="menuitem"
          (click)="closeMenu()"
        >
          <ui-icon name="people" [decorative]="true" [size]="18" />
          <span>Clientes</span>
        </a>
      </div>
    }
  </div>

  <!-- User account menu -->
  <div class="nav-menu" (click)="onMenuClick($event)">
    <button
      class="nav-item ui-nav-item"
      type="button"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú de usuario"
      (click)="toggleMenu($event)"
    >
      <ui-icon name="account_circle" [decorative]="true" [size]="20" />
      <span class="nav-item__label">Cuenta</span>
    </button>
    @if (menuOpen()) {
      <div class="ui-menu" role="menu">
        <div class="px-4 py-2 border-b">
          <div class="font-medium">{{ auth.appUser()?.displayName }}</div>
          <div class="text-xs text-gray-500">{{ auth.appUser()?.email }}</div>
          <div class="text-xs mt-1">
            <span
              class="inline-block px-2 py-0.5 rounded-full text-white"
              [class]="auth.isOwner() ? 'bg-rose-500' : 'bg-blue-500'"
            >
              {{ auth.isOwner() ? 'Dueña' : 'Ayudante' }}
            </span>
          </div>
        </div>
        <button
          class="ui-menu-item"
          type="button"
          role="menuitem"
          (click)="navigateToFinancialReports()"
        >
          <ui-icon name="banknote" [decorative]="true" [size]="18" />
          <span>Reportes financieros</span>
        </button>
        <button
          class="ui-menu-item"
          type="button"
          role="menuitem"
          (click)="navigateToBackupRestore()"
        >
          <ui-icon name="database_backup" [decorative]="true" [size]="18" />
          <span>Backup y restore</span>
        </button>
        <button class="ui-menu-item" type="button" role="menuitem" (click)="logout()">
          <ui-icon name="logout" [decorative]="true" [size]="18" />
          <span>Cerrar sesión</span>
        </button>
      </div>
    }
  </div>
</nav>
